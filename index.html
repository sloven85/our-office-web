		<script>
// ───────── 안드로이드 뒤로가기 ─────────
//
// 이 게임은 웹뿐이다(export_presets.cfg 에 프리셋이 하나). 안드로이드 앱이
// 아니라 안드로이드 크롬으로 여는 웹페이지라, "뒤로가기 버튼"은 Godot 이 아니라
// **브라우저의 세션 기록**이 받는다. 막아 두지 않으면 뒤로가기 한 번에 페이지를
// 벗어나 게임이 그대로 꺼진다.
//
// 가짜 기록을 하나 쌓아 두고, 뒤로가기가 그 기록만 지우면(popstate) **곧바로
// 다시 쌓는다** — 실제 이동은 없던 일이 되고, 그 대신 숫자 하나만 올라간다.
// 실시간 채팅이 이미 쓰는 길과 같다 — window.__office_chat 을 창에 적어 두고
// Godot 이 들여다본다(LiveChat.gd). JavaScriptBridge.create_callback 은 전에
// 아이패드에서 안 먹혀서 버린 길이다(MessengerPanel.gd 의 주석 참고).
//
// **설치한 뒤(PWA·홈 화면에서 바로 연 상태)에는 이걸로 부족했다** — 안드로이드
// 크롬은 매번 **글자 그대로 같은 주소**로 쌓은 가짜 기록을 "갈 데가 없다" 고
// 보고, popstate 를 던지지도 않고 곧장 앱을 꺼 버린다(탭으로 열었을 때는
// 문제가 안 됐다 — 브라우저 UI 가 있어 다르게 처리하는 듯하다). 그래서 쌓을
// 때마다 해시 뒤에 번호를 붙여 **매번 정말로 다른 주소**를 쌓는다.
//
// **그래도 설치본에서는 여전히 바로 꺼졌다.** 홈 화면에 설치하면 크롬이
// 이 사이트를 "WebAPK"(진짜 안드로이드 앱 껍데기)로 한 번 더 감싸는데, 그
// 뒤로가기는 popstate 보다 한 단 위(웹뷰 자체)에서 처리되는 것으로 보인다 —
// pushState/popstate 만으로는 그 단에 안 닿는 듯하다. 그래서 두 가지를
// 같이 건다:
//   1) 뒤로가기 전용으로 나온 최신 Navigation API(Chrome 102+) —
//      event.intercept() 가 실제 이동 자체를 막아 버린다.
//   2) 그래도 옛 pushState/popstate 조합도 그대로 남겨 둔다 — 어느 쪽이든
//      걸리면 된다. 하나의 뒤로가기에 둘 다 걸려도 상관없다(Hud.gd 는 폴링
//      주기 안에서 숫자가 늘었는지만 보고 한 번만 반응한다, _poll_back).
//   처음에 가짜 기록을 **두 개** 쌓아 둔다 — 하나만으로는 설치본에서 "갈
//   데가 없다" 고 보고 아예 이 스크립트까지 안 오고 꺼져 버리는 것 같아서,
//   여유를 하나 더 둔다.
window.__office_back = 0;
var __office_exit_confirmed = false;
// 게임이 "종료하시겠습니까" 에서 [종료하기] 를 눌렀을 때 부른다.
// 이번엔 가로채지 않고 그대로 흘려보내 진짜로 뒤로 나간다.
window.__office_confirm_exit = function () {
	__office_exit_confirmed = true;
	history.back();
};
(function () {
	if (!window.history || !window.history.pushState) return;
	var n = 0;
	function push() {
		n++;
		history.pushState({ officeBack: true }, '', location.pathname + location.search + '#ob' + n);
	}
	push();
	push();

	if (window.navigation && typeof window.navigation.addEventListener === 'function') {
		window.navigation.addEventListener('navigate', function (event) {
			if (event.navigationType !== 'traverse' || __office_exit_confirmed) return;
			event.intercept({ handler: function () {
				window.__office_back++;
			} });
		});
	}

	// popstate 도 같이 듣는다 — Navigation API 가 있어도 걸어 둔다(위 주석 참고).
	var armed = true;
	window.addEventListener('popstate', function () {
		if (__office_exit_confirmed || !armed) return;
		armed = false;
		window.__office_back++;
		push();
		armed = true;
	});
})();

// Firebase 접속 설정. 비밀이 아니다 — 막는 것은 Firestore 규칙과 로그인이다.
// scripts/net/FirebaseConfig.gd 와 **같은 값**이어야 한다 (cloudtest 가 확인한다).
const OFFICE_FIREBASE = {
	apiKey: 'AIzaSyDLPKxmqTH2SuyebReO1dE16Bqa6gNP0Bs',
	authDomain: 'our-office-jkjh.firebaseapp.com',
	projectId: 'our-office-jkjh',
};

// 이 브라우저의 이름. 사무실을 맡을 기기를 고를 때 쓴다 — **계정이 아니라 기기로**
// 세야 한다. 같은 계정으로 PC 와 휴대폰을 같이 켜 두면 계정으로 셀 때는 둘 다
// 자기가 맡은 줄 알고 답을 두 번 만든다. 한 번 만들어 이 브라우저에 남겨 둔다.
window.__office_dev = (function () {
	try {
		var got = localStorage.getItem('office_dev');
		if (!got) {
			got = 'd' + Math.random().toString(36).slice(2, 10);
			localStorage.setItem('office_dev', got);
		}
		return got;
	} catch (e) {
		// 사이트 데이터를 막아 둔 브라우저. 이번 판에만 쓰는 이름으로 간다.
		return 'd' + Math.random().toString(36).slice(2, 10);
	}
})();

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4516144,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[],"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;

// **빌드마다 pck 주소를 바꾼다.**
//
// 게임 코드는 전부 index.pck 안에 있는데, 이름이 늘 같아서 브라우저가 옛 것을
// 그대로 들고 있었다. 새로 올린 것이 "안 보인다" 는 일이 이 때문에 되풀이됐다 —
// 배포는 멀쩡한데 화면만 예전 것이라, 코드가 틀린 건지 옛 빌드인 건지 가릴 수가
// 없었다 (설정의 "빌드" 줄도 그래서 생겼다).
//
// 주소 뒤에 빌드 번호를 붙이면 새 빌드는 브라우저에게 **다른 파일**이라 반드시
// 새로 받는다. wasm(35MB)은 건드리지 않는다 — 엔진을 올릴 때나 바뀌는 것이라,
// 그건 오히려 계속 캐시에 남아 있는 편이 낫다.
// 도장은 워크플로가 갈아 끼운다 (.github/workflows/web-build.yml 의 "빌드 도장").
const OFFICE_BUILD = '49f16db';
if (OFFICE_BUILD !== 'dev') {
	GODOT_CONFIG['mainPack'] = (GODOT_CONFIG['executable'] || 'index')
		+ '.pck?v=' + encodeURIComponent(OFFICE_BUILD);
}

// **새 빌드의 서비스 워커를 기다리게 두지 않는다.**
//
// 위의 pck 주소 바꾸기만으로는 모자랐다. Godot 서비스 워커는 index.html 을 캐시에서
// 먼저 꺼내 주고, 새로 올린 빌드의 워커는 설치만 해 두고 **이 사이트 탭이 전부 닫힐
// 때까지 대기**한다. 휴대폰 브라우저는 탭을 좀처럼 닫지 않아서 예전 index.html(예전
// 빌드 번호 → 예전 pck)이 계속 떴다 — 배포 후에도 설정의 빌드 줄이 이전 번호였다.
//
// 대기 중인 워커가 있으면 곧장 넘겨받게 하고('update' — 워커가 skipWaiting · claim 뒤
// 열린 탭을 새로 불러온다), 이 페이지를 연 뒤에 새 워커가 설치돼도 똑같이 한다.
// 새 워커가 넘겨받은 뒤에는 대기 중인 것이 없으니 되풀이되지 않는다.
if (OFFICE_BUILD !== 'dev' && 'serviceWorker' in navigator) {
	navigator.serviceWorker.getRegistration().then((reg) => {
		if (!reg) {
			return;                        // 처음 온 사람 — 첫 워커는 바로 켜진다
		}
		const takeOver = (w) => {
			if (w && navigator.serviceWorker.controller) {
				w.postMessage('update');
			}
		};
		takeOver(reg.waiting);
		reg.addEventListener('updatefound', () => {
			const w = reg.installing;
			if (w) {
				w.addEventListener('statechange', () => {
					if (w.state === 'installed') {
						takeOver(w);
					}
				});
			}
		});
		reg.update().catch(() => {});
	}).catch(() => {});
}

const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		// 로그인이 끝난 뒤에 엔진을 시작한다 (아래 gate 참고)
		window.__officeStart = startEngine;
		gate();
		offerApkDownload();
	}

	// ───────── 안드로이드 앱 다운로드 안내 ─────────
	//
	// 지금까지는 이 안내가 배포 저장소(our-office-web)의 README 에만 있어서,
	// 게임 페이지만 보고 들어온 사람은 안드로이드 앱이 있는지조차 몰랐다.
	// 여기(로그인 화면)에 적어 둔다 — gate() 와 달리 로그인 상태와 무관하게
	// 늘 시도한다(이미 로그인돼 있어 게이트가 바로 사라지는 사람도 있어서).
	//
	// 안드로이드 내보내기는 선택(시크릿이 없으면 건너뛴다)이라 이 파일이 항상
	// 있다는 보장이 없다 — 있는지 먼저 확인한 뒤에만 링크를 보여준다.
	function offerApkDownload() {
		if (OFFICE_BUILD === 'dev') {
			return;                        // 직접 실행할 때는 배포 파일이 없다
		}
		const box = document.getElementById('gate-box');
		if (!box) {
			return;
		}
		fetch('office.apk', { method: 'HEAD' }).then((res) => {
			if (!res.ok || !box.isConnected) {
				return;
			}
			const p = document.createElement('p');
			p.className = 'fine';
			const a = document.createElement('a');
			a.href = 'office.apk';
			a.textContent = '안드로이드 앱으로 받기';
			a.style.color = 'inherit';
			p.appendChild(a);
			box.appendChild(p);
		}).catch(() => {});
	}

	function startEngine() {
		setStatusMode('progress');
		return engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}

	// ───────── 로그인 게이트 ─────────
	//
	// 설정이 비어 있으면 그냥 게임을 시작한다. 서버 없이도 온전해야 한다는 원칙 그대로다.
	// 이미 로그인돼 있으면 화면을 보여주지 않고 바로 넘어간다.
	function gate() {
		const box = document.getElementById('gate');
		const btn = document.getElementById('gate-google');
		const skip = document.getElementById('gate-skip');
		const err = document.getElementById('gate-err');

		function go() {
			box.remove();
			window.__officeStart();
		}

		if (!OFFICE_FIREBASE.apiKey || !OFFICE_FIREBASE.projectId) {
			go();
			return;
		}

		skip.onclick = go;

		let auth = null;
		const ready = (async () => {
			const [appMod, authMod] = await Promise.all([
				import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
				import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
			]);
			const app = appMod.getApps().length ? appMod.getApps()[0] : appMod.initializeApp(OFFICE_FIREBASE);
			auth = authMod.getAuth(app);
			return authMod;
		})();

		// 지난번에 들어왔던 브라우저면 다시 묻지 않는다
		ready.then((m) => new Promise((resolve) => {
			const off = m.onAuthStateChanged(auth, (user) => { off(); resolve(user); });
		})).then((user) => (user ? hand(user) : null)).catch(() => {});

		// 게임이 부른다. 로그인 토큰은 **한 시간이면 만료되는데**, 게임은 시작할 때
		// 받은 글자 하나만 들고 있어서 그 뒤로는 서버에 읽지도 쓰지도 못했다.
		// (그래서 한 시간 넘게 논 기기의 저장이 통째로 안 올라갔다.)
		// SDK 는 로그인 세션을 쥐고 있으니 여기서 새 토큰을 받아 같은 자리에 넣어 준다.
		// 약속(Promise)이라 바로는 못 준다 — 게임 쪽에서 이 자리를 들여다본다.
		window.__office_refresh = () => {
			try {
				const user = auth && auth.currentUser;
				if (!user || !window.__office_auth) return false;
				user.getIdToken(true)
					.then((t) => { window.__office_auth.idToken = t; })
					.catch((e) => console.error('refresh:', e));
				return true;
			} catch (e) {
				console.error('refresh:', e);
				return false;
			}
		};

		// 게임 안 설정 화면에서 부른다. 로그아웃하면 페이지를 다시 열어
		// 처음부터(로그인 화면부터) 시작한다 — 세션이 어중간하게 남는 것보다 낫다.
		window.__office_signout = async () => {
			try {
				const m = await ready;
				await m.signOut(auth);
			} catch (e) {
				console.error('signOut:', e);
			}
			window.__office_auth = null;
			location.reload();
		};

		function stamp(user, token) {
			window.__office_auth = {
				ok: true,
				idToken: token,
				uid: user.uid,
				email: user.email || '',
				name: (user.displayName || (user.email || '').split('@')[0] || '누군가'),
			};
		}

		async function hand(user) {
			stamp(user, await user.getIdToken());

			// 토큰은 **한 시간이면 만료된다.** SDK 는 그전에 알아서 새로 받아 오는데,
			// 그때마다 여기에 다시 적어 두지 않으면 게임은 낡은 글자를 계속 들고 있게
			// 된다. 그러면 서버(중계소·Firestore)가 전부 401 로 거절한다 —
			// 한 시간쯤 놀고 나면 직원들이 "잠시만요" 만 하던 까닭이 이것이다.
			// 게임이 새 토큰을 **달라고 할 때까지** 기다릴 일이 아니다.
			ready.then((m) => {
				m.onIdTokenChanged(auth, async (u) => {
					if (!u) { window.__office_auth = null; return; }
					try {
						stamp(u, await u.getIdToken());
					} catch (e) {
						console.error('token:', e);
					}
				});
			}).catch(() => {});

			await live(user).catch((e) => console.error('live chat:', e));
			go();
		}

		// ───────── 실시간 채팅 ─────────
		//
		// Firestore 문서 하나(office/live)에 최근 메시지를 담아 두고 onSnapshot 으로 듣는다.
		// REST 로는 이렇게 밀어 주는 것을 못 받는다. 여기는 이미 SDK 를 불러와 두었으니
		// 듣는 것도 보내는 것도 자바스크립트 쪽에서 하고, 게임은 결과만 읽어 간다.
		//
		// 보낼 때 arrayUnion 을 쓴다. 둘이 동시에 쳐도 서로의 말을 지우지 않는다 —
		// 문서를 통째로 다시 쓰면 나중 사람이 먼저 사람 것을 덮어쓴다.
		async function live(user) {
			const fs = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
			const db = fs.getFirestore(auth.app);
			const ref = fs.doc(db, 'office', 'live');

			fs.onSnapshot(ref, (snap) => {
				const d = snap.data() || {};
				window.__office_chat = JSON.stringify(d.msgs || []);
				// 지금 누가 들어와 있는가 — 게임이 사무실을 맡을 기기를 여기서 고른다
				window.__office_who = JSON.stringify(d.who || {});
				// 언제 대화를 비웠는가. 한쪽에서 비우면 상대도 이걸 보고 비운다.
				window.__office_clear = d.clear_at || 0;
			}, (e) => console.error('onSnapshot:', e));

			window.__office_send = (room, from, body, color, kind, id, day, min, sid) => {
				const entry = {
					// 번호는 게임이 붙여 온다. 없으면 여기서 만든다 —
					// 같은 밀리초에 둘이 쳐도 겹치지 않게 무작위를 섞는다.
					id: id || (Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8)),
					room: room, from: from, body: body, color: color || '',
					// sid = 누가 한 말인지(캐릭터 id). 이름은 바뀔 수 있어서
					// 받는 쪽이 이름만으로는 얼굴을 못 붙인다.
					kind: kind || 'user', sid: sid || '', day: day || 0, min: min || 0,
					uid: user.uid, at: Date.now(),
				};
				fs.setDoc(ref, { msgs: fs.arrayUnion(entry) }, { merge: true })
					.catch((e) => console.error('send:', e));
			};

			// 살아 있다고 알린다 (ai = 이 기기가 AI 로 답할 수 있는가).
			// 게임이 30초에 한 번 부른다 — 잦게 부르면 Firestore 쓰기만 먹는다.
			//
			// **계정이 아니라 기기로 센다.** 같은 계정으로 PC 와 휴대폰을 같이 켜 두면
			// 계정으로 셀 때는 둘 다 자기가 사무실을 맡은 줄 알아서 답이 두 번 나온다.
			// 기기 이름은 이 브라우저에 한 번 만들어 두고 계속 쓴다.
			window.__office_here = (ai) => {
				const who = {};
				who[window.__office_dev] = { at: Date.now(), ai: !!ai, uid: user.uid };
				fs.setDoc(ref, { who: who }, { merge: true })
					.catch((e) => console.error('here:', e));
			};

			// 주고받던 기록을 지운다. **언제 지웠는지**를 같이 남겨야 상대 기기도
			// 자기 것을 비운다 — 안 그러면 상대가 다음에 저장할 때 도로 올라온다.
			window.__office_clear_chat = (at) => {
				fs.setDoc(ref, { msgs: [], clear_at: at || Date.now() }, { merge: true })
					.catch((e) => console.error('clear:', e));
			};

			// 문서가 끝없이 자라지 않게 가끔 앞을 잘라 둔다.
			// 둘이 동시에 자르면 하나가 헛돌 뿐 잃는 것은 없다.
			window.__office_trim = async () => {
				const snap = await fs.getDoc(ref);
				const msgs = (snap.data() || {}).msgs || [];
				if (msgs.length > 120) {
					await fs.setDoc(ref, { msgs: msgs.slice(-60) }, { merge: true });
				}
			};
		}

		btn.onclick = async () => {
			btn.disabled = true;
			err.textContent = '';
			try {
				const m = await ready;
				const res = await m.signInWithPopup(auth, new m.GoogleAuthProvider());
				await hand(res.user);
			} catch (e) {
				btn.disabled = false;
				err.textContent = explain(String((e && e.code) || e));
			}
		};
	}

	// 구글이 주는 코드는 그대로 보여줘도 알 수 없다. 셋은 할 일이 서로 다르다.
	function explain(code) {
		if (code.includes('popup-blocked')) {
			return '브라우저가 로그인 창을 막았습니다. 팝업을 허용하고 다시 눌러주세요.';
		}
		if (code.includes('popup-closed') || code.includes('cancelled-popup')) {
			return '로그인 창을 닫으셨습니다.';
		}
		if (code.includes('unauthorized-domain')) {
			return '이 주소가 Firebase 승인된 도메인에 없습니다 (Authentication → Settings).';
		}
		if (code.includes('operation-not-allowed')) {
			return '구글 로그인이 꺼져 있습니다 (Authentication → 로그인 방법).';
		}
		if (code.includes('network')) {
			return '네트워크에 연결하지 못했습니다.';
		}
		return '로그인에 실패했습니다 — ' + code;
	}
}());
		</script>
	</body>
